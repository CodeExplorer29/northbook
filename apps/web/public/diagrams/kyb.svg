<svg xmlns="http://www.w3.org/2000/svg" width="728" height="256" viewBox="0 0 728 256" role="img" aria-labelledby="diagram-title diagram-description" font-family="Geist Sans,system-ui,sans-serif"><title id="diagram-title">KYB lifecycle</title><desc id="diagram-description">Draft → Submitted: Submit (client). Submitted → Approved: Approve (staff). Submitted → Rejected: Reject (staff).</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c6662" stroke-width="1.5"/></marker></defs>
<g data-from="draft" data-to="submitted" data-event="submit" data-actor="client"><path id="edge-0" d="M164 70H290" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="229" y="58" text-anchor="middle" font-size="11" fill="#5c6662">Submit</text><text x="229" y="73" text-anchor="middle" font-size="10" fill="#5c6662">client</text></g>
<g data-from="submitted" data-to="approved" data-event="approve" data-actor="staff"><path id="edge-1" d="M434 70H560" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="499" y="58" text-anchor="middle" font-size="11" fill="#5c6662">Approve</text><text x="499" y="73" text-anchor="middle" font-size="10" fill="#5c6662">staff</text></g>
<g data-from="submitted" data-to="rejected" data-event="reject" data-actor="staff"><path id="edge-2" d="M364 92C364 136 364 136 364 176" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="136" text-anchor="start" font-size="11" fill="#5c6662">Reject</text><text x="376" y="151" text-anchor="start" font-size="10" fill="#5c6662">staff</text></g>
<g data-state="draft"><rect x="24" y="48" width="140" height="44" rx="22" fill="#ffffff" stroke="#073d30" stroke-width="1.5"/><text x="94" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#131a17">Draft</text></g>
<g data-state="submitted"><rect x="294" y="48" width="140" height="44" rx="22" fill="#ffffff" stroke="#c4ccc8" stroke-width="1"/><text x="364" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#131a17">Submitted</text></g>
<g data-state="approved"><rect x="564" y="48" width="140" height="44" rx="22" fill="#e3f6ef" stroke="#c4ccc8" stroke-width="1"/><text x="634" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#0e7a5f">Approved</text></g>
<g data-state="rejected"><rect x="294" y="180" width="140" height="44" rx="22" fill="#fbeae8" stroke="#c4ccc8" stroke-width="1"/><text x="364" y="207" text-anchor="middle" font-size="14" font-weight="500" fill="#c0392b">Rejected</text></g>
</svg>
