<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="256" viewBox="0 0 1190 256" role="img" aria-labelledby="diagram-title diagram-description" font-family="Geist Sans,system-ui,sans-serif"><title id="diagram-title">TRADE lifecycle</title><desc id="diagram-description">Awaiting client funds → Funds received: Funds received (staff). Funds received → Payout sent: Payout sent (staff). Payout sent → Settled: Payout confirmed (staff). Awaiting client funds → Cancelled: Cancel (staff).</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c6662" stroke-width="1.5"/></marker></defs>
<g data-from="awaiting_client_funds" data-to="funds_received" data-event="funds_received" data-actor="staff"><path id="edge-0" d="M212 70H338" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="277" y="58" text-anchor="middle" font-size="11" fill="#5c6662">Funds received</text><text x="277" y="73" text-anchor="middle" font-size="10" fill="#5c6662">staff</text></g>
<g data-from="funds_received" data-to="payout_sent" data-event="payout_sent" data-actor="staff"><path id="edge-1" d="M530 70H656" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="595" y="58" text-anchor="middle" font-size="11" fill="#5c6662">Payout sent</text><text x="595" y="73" text-anchor="middle" font-size="10" fill="#5c6662">staff</text></g>
<g data-from="payout_sent" data-to="settled" data-event="payout_confirmed" data-actor="staff"><path id="edge-2" d="M848 70H974" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="913" y="58" text-anchor="middle" font-size="11" fill="#5c6662">Payout confirmed</text><text x="913" y="73" text-anchor="middle" font-size="10" fill="#5c6662">staff</text></g>
<g data-from="awaiting_client_funds" data-to="cancelled" data-event="cancel" data-actor="staff"><path id="edge-3" d="M118 92C118 136 118 136 118 176" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="130" y="136" text-anchor="start" font-size="11" fill="#5c6662">Cancel</text><text x="130" y="151" text-anchor="start" font-size="10" fill="#5c6662">staff</text></g>
<g data-state="awaiting_client_funds"><rect x="24" y="48" width="188" height="44" rx="22" fill="#ffffff" stroke="#073d30" stroke-width="1.5"/><text x="118" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#131a17">Awaiting client funds</text></g>
<g data-state="funds_received"><rect x="342" y="48" width="188" height="44" rx="22" fill="#ffffff" stroke="#c4ccc8" stroke-width="1"/><text x="436" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#131a17">Funds received</text></g>
<g data-state="payout_sent"><rect x="660" y="48" width="188" height="44" rx="22" fill="#ffffff" stroke="#c4ccc8" stroke-width="1"/><text x="754" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#131a17">Payout sent</text></g>
<g data-state="settled"><rect x="978" y="48" width="188" height="44" rx="22" fill="#e3f6ef" stroke="#c4ccc8" stroke-width="1"/><text x="1072" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#0e7a5f">Settled</text></g>
<g data-state="cancelled"><rect x="24" y="180" width="188" height="44" rx="22" fill="#fbeae8" stroke="#c4ccc8" stroke-width="1"/><text x="118" y="207" text-anchor="middle" font-size="14" font-weight="500" fill="#c0392b">Cancelled</text></g>
</svg>
