<svg xmlns="http://www.w3.org/2000/svg" width="458" height="256" viewBox="0 0 458 256" role="img" aria-labelledby="diagram-title diagram-description" font-family="Geist Sans,system-ui,sans-serif"><title id="diagram-title">QUOTE lifecycle</title><desc id="diagram-description">Active → Accepted: Accept (client). Active → Expired: Expire (system).</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c6662" stroke-width="1.5"/></marker></defs>
<g data-from="active" data-to="accepted" data-event="accept" data-actor="client"><path id="edge-0" d="M164 70H290" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="229" y="58" text-anchor="middle" font-size="11" fill="#5c6662">Accept</text><text x="229" y="73" text-anchor="middle" font-size="10" fill="#5c6662">client</text></g>
<g data-from="active" data-to="expired" data-event="expire" data-actor="system"><path id="edge-1" d="M94 92C94 136 94 136 94 176" fill="none" stroke="#5c6662" stroke-width="1.5" marker-end="url(#arrow)"/><text x="106" y="136" text-anchor="start" font-size="11" fill="#5c6662">Expire</text><text x="106" y="151" text-anchor="start" font-size="10" fill="#5c6662">system</text></g>
<g data-state="active"><rect x="24" y="48" width="140" height="44" rx="22" fill="#ffffff" stroke="#073d30" stroke-width="1.5"/><text x="94" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#131a17">Active</text></g>
<g data-state="accepted"><rect x="294" y="48" width="140" height="44" rx="22" fill="#e3f6ef" stroke="#c4ccc8" stroke-width="1"/><text x="364" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#0e7a5f">Accepted</text></g>
<g data-state="expired"><rect x="24" y="180" width="140" height="44" rx="22" fill="#fbeae8" stroke="#c4ccc8" stroke-width="1"/><text x="94" y="207" text-anchor="middle" font-size="14" font-weight="500" fill="#c0392b">Expired</text></g>
</svg>
