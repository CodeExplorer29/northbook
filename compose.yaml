name: northbook

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: northbook_owner
      POSTGRES_DB: northbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U northbook_owner -d northbook']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
